name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create GitHub Releases

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # secrets is not allowed in `if:` expressions, so mirror it into env first.
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Check if version already exists on Modrinth
        id: check-modrinth
        run: |
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          PROJECT_ID="$(sed -n 's/^modrinth_project_id=//p' gradle.properties)"
          echo "Modrinth project ${PROJECT_ID}, version ${MOD_VERSION}"
          AUTH_ARGS=()
          if [ -n "${MODRINTH_TOKEN}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${MODRINTH_TOKEN}")
          fi
          if curl -fsSL "${AUTH_ARGS[@]}" "https://api.modrinth.com/v2/project/${PROJECT_ID}/version" -o versions.json 2>/dev/null \
             && jq -e --arg v "${MOD_VERSION}" '[.[] | select(.version_number == $v)] | length > 0' versions.json >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Modrinth version ${MOD_VERSION} already exists - skipping upload"
          else
            echo "Modrinth version ${MOD_VERSION} not found - upload will run"
          fi

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && steps.check-modrinth.outputs.exists != 'true' }}
        run: ./gradlew modrinth --no-daemon

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != '' }}
        run: |
          set -eu
          # Never echo the token (it is a project-scoped upload credential).
          echo "::add-mask::${CURSEFORGE_TOKEN}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          JAR="build/libs/bedrock-adb-${MOD_VERSION}.jar"
          test -f "${JAR}"
          # Changelog section for the current version, taken from CHANGELOG.md.
          # (Output uses a distinct name: on case-insensitive filesystems
          # "changelog.md" would clobber the tracked CHANGELOG.md.)
          awk -v v="${MOD_VERSION}" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > cf-changelog.md
          # Environment tags are part of the game version list on CurseForge.
          # This mod is client-side only (fabric.mod.json "environment": "client").
          jq -n \
            --arg display "bedrock-adb ${MOD_VERSION}" \
            --arg changelog "$(cat cf-changelog.md)" \
            '{displayName: $display, changelog: $changelog, changelogType: "markdown", releaseType: "release", gameVersionNames: ["1.21", "Fabric", "Client", "Java 21"]}' > cf-metadata.json
          # The metadata JSON must be sent verbatim as a form field. `-F` is not
          # usable here: it expands `\n` inside the value into real newlines, so
          # CurseForge receives a multi-line document and answers errorCode 1002
          # "Invalid JSON". `--form-string` passes the payload through unchanged
          # and also keeps `@`/`<` from being read as file references. The part
          # still has to declare itself as JSON.
          METADATA="$(jq -c . cf-metadata.json)"
          echo "Uploading ${JAR} with metadata (${#METADATA} bytes):"
          echo "${METADATA}"
          HTTP_CODE="$(curl -sS --max-time 300 -o cf-response.json -w '%{http_code}' \
            -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
            --form-string "metadata=${METADATA};type=application/json" \
            -F "file=@${JAR}" \
            "https://legacy.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          cat cf-response.json || true
          if [ "${HTTP_CODE}" != "200" ] || ! jq -e '.id' cf-response.json >/dev/null 2>&1; then
            echo "::error::CurseForge upload failed (http ${HTTP_CODE})"
            exit 1
          fi
          echo "CurseForge file id: $(jq -r '.id' cf-response.json)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
